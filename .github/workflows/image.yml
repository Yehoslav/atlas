name: Image

# The container image, built where there are cores and memory.
#
# A Dockerfile that nobody builds is a Dockerfile that does not work, and the
# machine that can least afford to find that out is the one it would be
# built on: building the Rust dependency tree and the ImageMagick runtime is
# unnecessary work on a small service host. CI builds the image, and the
# server pulls a versioned tag.

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
    # Coarse SemVer-shaped glob; the exact Cargo.toml equality check below is
    # authoritative, including pre-release labels such as `-alpha.1`.
    tags: ["[0-9]+.[0-9]+.[0-9]+*"]
  # Built by hand, from the Actions tab or from a clone:
  #   gh workflow run image.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/yehoslav/atlas
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            # Only stable SemVer tags update the floating convenience tag.
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}

      - name: Check the tag matches the crate version
        if: github.ref_type == 'tag'
        run: |
          expected="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml)"
          if [[ "$GITHUB_REF_NAME" != "$expected" ]]; then
            echo "Tag $GITHUB_REF_NAME must match Cargo.toml version ($expected)." >&2
            exit 1
          fi

      - name: Log in to GitHub Container Registry
        if: github.ref_type == 'tag'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the image for the smoke test
        # The build runs the repository's own codec check inside the image,
        # so an image without JPEG XL or LCMS cannot be produced. The check
        # is the same one the development shell and the startup path make.
        uses: docker/build-push-action@v6
        if: ${{ github.ref_type != 'tag' }}
        with:
          context: .
          load: true
          tags: |
            ${{ steps.meta.outputs.tags }}
            atlas:ci
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and publish the versioned image
        if: github.ref_type == 'tag'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: The image starts and serves
        if: ${{ github.ref_type != 'tag' }}
        # A build that produces an image nobody has run is a build that
        # produces an image nobody has run. The service refuses to start
        # without the codecs, so this also proves the codecs are there.
        run: |
          docker run --detach --name atlas --publish 127.0.0.1:3000:3000 \
            --env ATLAS_API_TOKEN=image-check-token \
            --volume atlas-image-check:/var/lib/atlas \
            atlas:ci
          for _ in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:3000/healthz; then
              echo
              break
            fi
            sleep 1
          done
          curl --silent --fail http://127.0.0.1:3000/healthz
          docker logs atlas
          docker rm --force atlas
          docker volume rm atlas-image-check
