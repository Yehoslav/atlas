[package]
name = "cms-admin"
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.85"
description = "An admin dashboard for Atlas, written as an ordinary API consumer"
license = "GPL-3.0-only"

# Deliberately not a member of the service's workspace, and deliberately not
# depending on `atlas`. Everything here goes over HTTP, which is the point of
# the example: it is how we test the API from the outside.
[workspace]

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dotenvy = "0.15"
getrandom = "0.3"
minijinja = { version = "2", features = ["loader"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"] }
tower-http = { version = "0.6", features = ["fs"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
